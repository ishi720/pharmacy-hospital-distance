<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>東京の薬局と最寄り医療機関の距離</title>
  </head>
  <body>
    <div id="map"></div>
    <aside id="side">
      <h2>表示する距離（最寄りの病院・診療所まで）</h2>
      <div id="bins"></div>
      <label class="row"><input type="checkbox" id="medical-toggle" />病院・診療所の位置（灰色）</label>
      <p class="note">線は各薬局から最寄りの病院・診療所（白抜きの丸）への直線です。</p>
      <h2>遠い薬局 TOP15</h2>
      <ol id="ranking"></ol>
      <p class="note">
        出典：厚生労働省「医療情報ネットのオープンデータ」（2026年6月1日時点）を加工して作成。
        座標の欠けは Geolonia 住所データ（CC BY 4.0）で補完。距離は直線距離。
        老人ホームの医務室など一般向けでない施設は除外。
      </p>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
